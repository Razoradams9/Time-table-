# Fly.io config for the Timetable backend.
# `fly launch` will prompt to pick/confirm the app name and region; it may
# rewrite this file. Keep the [http_service] and [[http_service.checks]] bits.

app = "timetable-backend"       # change to a unique name during `fly launch`
primary_region = "sin"          # Singapore; pick the region nearest you

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine always running for 24/7 warmth (no cold starts).
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
